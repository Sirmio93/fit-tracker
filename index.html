<!doctype html>
<html lang="it">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Fit Circuit Tracker</title>
    <style>
        :root {
            --bg: #f5f5f7;
            --card: rgba(255, 255, 255, .82);
            --text: #1d1d1f;
            --muted: #6e6e73;
            --line: rgba(60, 60, 67, .14);
            --pri: #7c3aed;
            --pri2: #a78bfa;
            --ok: #34c759;
            --bad: #ff3b30;
            --soft: rgba(124, 58, 237, .10);
            --shadow: 0 18px 45px rgba(0, 0, 0, .08);
            --r: 22px
        }

        [data-theme=dark] {
            --bg: #000;
            --card: rgba(28, 28, 30, .78);
            --text: #f5f5f7;
            --muted: #a1a1a6;
            --line: rgba(235, 235, 245, .16);
            --soft: rgba(124, 58, 237, .22);
            --shadow: 0 20px 50px rgba(0, 0, 0, .5)
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: radial-gradient(circle at top, #fff 0, var(--bg) 42%);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Inter, Segoe UI, Roboto, Arial, sans-serif
        }

        .app {
            max-width: 820px;
            margin: auto;
            padding: 10px 10px 132px
        }

        .top {
            position: sticky;
            top: 0;
            z-index: 30;
            margin: 0 -10px 10px;
            padding: 10px;
            background: color-mix(in srgb, var(--bg) 80%, transparent);
            backdrop-filter: blur(22px);
            border-bottom: 1px solid var(--line)
        }

        .brand {
            display: flex;
            gap: 10px;
            align-items: center
        }

        .logo {
            width: 34px;
            height: 34px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--pri), var(--pri2));
            color: #fff;
            display: grid;
            place-items: center;
            font-weight: 900
        }

        h1 {
            font-size: 16px;
            margin: 0
        }

        .sub,
        .meta,
        .muted {
            color: var(--muted)
        }

        .sub {
            font-size: 11px;
            margin: 1px 0 0
        }

        .between,
        .row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap
        }

        .between {
            justify-content: space-between
        }

        .tabs {
            display: flex;
            gap: 6px;
            overflow: auto;
            margin-top: 8px
        }

        .tab,
        button {
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, .65);
            color: var(--text);
            border-radius: 999px;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 750;
            white-space: nowrap;
            cursor: pointer
        }

        .active,
        .primary {
            background: linear-gradient(135deg, var(--pri), var(--pri2));
            color: #fff !important;
            border-color: transparent !important
        }

        .ok {
            background: var(--ok);
            color: #fff;
            border-color: transparent
        }

        .bad {
            background: var(--bad);
            color: #fff;
            border-color: transparent
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--r);
            box-shadow: var(--shadow);
            padding: 12px;
            margin-bottom: 10px;
            backdrop-filter: blur(18px)
        }

        .card.primary {
            background: linear-gradient(135deg, var(--pri), var(--pri2)) !important;
            color: #fff !important
        }

        .card.primary .meta {
            color: rgba(255, 255, 255, .86) !important
        }

        .miniCard {
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px
        }

        .clickable {
            cursor: pointer
        }

        .clickable:active {
            transform: scale(.99)
        }

        h2 {
            font-size: 18px;
            margin: 0 0 4px
        }

        h3 {
            font-size: 15px;
            margin: 0;
            overflow-wrap: anywhere
        }

        .meta {
            font-size: 12px;
            margin-top: 3px;
            line-height: 1.35;
            overflow-wrap: anywhere
        }

        .pill {
            display: inline-flex;
            align-items: center;
            border-radius: 999px;
            padding: 5px 9px;
            font-size: 11px;
            font-weight: 800;
            background: var(--soft);
            color: var(--pri);
            white-space: nowrap
        }

        .bar {
            height: 7px;
            background: rgba(120, 120, 128, .18);
            border-radius: 99px;
            overflow: hidden;
            margin-top: 9px
        }

        .bar i {
            display: block;
            height: 100%;
            background: linear-gradient(90deg, var(--pri), var(--pri2))
        }

        .workoutHead {
            position: sticky;
            top: 92px;
            z-index: 12
        }

        .stack {
            display: grid;
            gap: 10px
        }

        .grid2 {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px
        }

        .grid3 {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px
        }

        .stepTitle {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .08em;
            font-weight: 850;
            color: var(--muted);
            margin: 4px 0 8px
        }

        .circuitBlock {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--r);
            box-shadow: var(--shadow);
            padding: 8px 10px;
            margin-bottom: 8px;
            backdrop-filter: blur(18px);
            transition: background .2s ease, border-color .2s ease
        }

        .circuitBlock summary {
            list-style: none;
            cursor: pointer;
            padding: 2px 0
        }

        .circuitBlock summary::-webkit-details-marker {
            display: none
        }

        .circuitBlock summary::before {
            content: "▸";
            display: inline-block;
            margin-right: 6px;
            color: var(--muted);
            transition: transform .15s ease
        }

        .circuitBlock[open] summary::before {
            transform: rotate(90deg);
            display: inline-block
        }

        .circuitBlock.done {
            background: rgba(52, 199, 89, .14);
            border-color: rgba(52, 199, 89, .42)
        }

        .pillDone {
            background: rgba(52, 199, 89, .22) !important;
            color: #1b7f3a !important
        }

        .exerciseList {
            display: grid;
            gap: 6px;
            margin-top: 8px
        }

        .exerciseCard {
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 6px 8px;
            background: rgba(255, 255, 255, .55)
        }

        .exHead {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 4px
        }

        .exHead>div {
            min-width: 0
        }

        .exHead b {
            font-size: 13px;
            display: block;
            overflow-wrap: anywhere;
            line-height: 1.15
        }

        .exHead small {
            display: block;
            font-size: 10.5px;
            color: var(--muted);
            overflow-wrap: anywhere;
            line-height: 1.15;
            margin-top: 1px
        }

        .targetRep {
            font-size: 11px;
            font-weight: 850;
            color: var(--pri);
            white-space: nowrap
        }

        .setRows {
            display: grid;
            gap: 6px
        }

        .setRow {
            display: grid;
            grid-template-columns: auto auto 1fr;
            gap: 8px;
            align-items: center;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 4px 8px;
            background: rgba(255, 255, 255, .55)
        }

        .setRow.noCheck {
            grid-template-columns: auto 1fr
        }

        .setRow.noCheck input[type=checkbox] {
            display: none !important
        }

        .setRow input[type=number] {
            padding: 5px 7px;
            font-size: 13px
        }

        .setRow label {
            font-size: 11px;
            font-weight: 850;
            color: var(--muted)
        }

        input {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 11px;
            background: rgba(255, 255, 255, .72);
            color: var(--text);
            padding: 7px;
            font: inherit;
            font-size: 12px;
            min-width: 0
        }

        input::placeholder {
            color: var(--muted);
            opacity: .8;
            font-size: 11px
        }

        .setRow input[type=checkbox],
        .roundChip input {
            width: 17px;
            height: 17px;
            padding: 0;
            accent-color: var(--ok)
        }

        .setRow input.missing {
            border-color: var(--bad) !important;
            background: rgba(255, 59, 48, .08);
            box-shadow: 0 0 0 1px rgba(255, 59, 48, .25)
        }

        .setRow input.missing::placeholder {
            color: var(--bad);
            opacity: .8
        }

        .roundPanel {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            margin-top: 6px
        }

        .roundChecks {
            display: flex;
            gap: 6px
        }

        .roundChip {
            display: flex;
            align-items: center;
            gap: 5px;
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 7px 10px;
            font-size: 12px;
            font-weight: 850;
            background: rgba(255, 255, 255, .58);
            cursor: pointer
        }

        .roundChip.done {
            background: rgba(52, 199, 89, .16);
            border-color: rgba(52, 199, 89, .42)
        }

        .timerDock {
            position: fixed;
            left: 10px;
            right: 10px;
            bottom: 10px;
            z-index: 40;
            max-width: 820px;
            margin: auto;
            background: rgba(29, 29, 31, .86);
            color: #fff;
            border-radius: 24px;
            box-shadow: 0 18px 45px rgba(0, 0, 0, .22);
            padding: 12px 14px;
            backdrop-filter: blur(22px)
        }

        .timerDock .muted {
            color: rgba(255, 255, 255, .66)
        }

        .timerTime {
            font-size: 30px;
            font-weight: 900
        }

        .hidden {
            display: none
        }

        .empty {
            opacity: .52
        }

        .sessionTimer {
            font-weight: 850;
            color: var(--pri)
        }

        .modalBackdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .45);
            z-index: 100;
            backdrop-filter: blur(6px)
        }

        .modal {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--r);
            box-shadow: var(--shadow);
            padding: 16px;
            z-index: 101;
            max-width: 520px;
            width: calc(100% - 24px);
            backdrop-filter: blur(20px)
        }

        .modalRow {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid var(--line)
        }

        .modalRow:last-child {
            border-bottom: 0
        }

        .modalRow .row {
            gap: 4px
        }

        .modalRow button {
            padding: 6px 10px;
            font-size: 11px
        }

        @media(max-width:620px) {

            .grid2,
            .grid3 {
                grid-template-columns: 1fr
            }

            .setRow {
                grid-template-columns: auto auto 1fr
            }

            .setRow.noCheck {
                grid-template-columns: auto 1fr !important
            }

            .roundPanel {
                align-items: flex-start;
                flex-direction: column
            }

            .roundChecks {
                width: 100%;
                display: grid;
                grid-template-columns: repeat(3, 1fr)
            }

            .roundChip {
                justify-content: center;
                padding: 8px 5px
            }

            .exHead {
                display: block
            }

            .targetRep {
                display: inline-block;
                margin-top: 3px
            }
        }
    </style>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#7c3aed">
</head>

<body>

        <div class="top">
            <div class="between">
                <div class="brand">
                    <div class="logo">FT</div>
                    <div>
                        <h1>Fit Circuit Tracker</h1>

    <script>

ripetizioni": "12-15", "target": "Tricipiti" } } }], "core": [{ "core1": { "nome_circuito": "Core finale A — Lunedì", "tipo": "circuito_core", "recupero": "30 sec tra esercizi, 45 sec tra giri", "esercizio1": { "nome_esercizio": "Cable crunch in ginocchio", "ripetizioni": "12-15", "target": "Retto addominale" }, "esercizio2": { "nome_esercizio": "Reverse crunch su panca piana", "ripetizioni": "12-15", "target": "Addome basso" }, "esercizio3": { "nome_esercizio": "Side plank hip dip", "ripetizioni": "12+12", "target": "Obliqui / laterali" }, "esercizio4": { "nome_esercizio": "Woodchopper al cavo alto-basso", "ripetizioni": "12+12", "target": "Obliqui / fianchi" } } }], "tabata": [], "hiit": [], "superserie": [] }, "mercoledi": { "nome_giorno": "Gambe + Spalle + Bicipiti + Core", "circuito": [{ "circuito1": { "nome_circuito": "Circuito 1 — Leg press + manubri", "tipo": "circuito_forza_metabolico", "recupero": "0 sec tra esercizi, 60-75 sec tra giri", "esercizio1": { "nome_esercizio": "Leg press controllata", "ripetizioni": "12-15", "target": "Quadricipiti / glutei" }, "esercizio2": { "nome_esercizio": "Alzate laterali manubri", "ripetizioni": "12-15", "target": "Deltoide medio" }, "esercizio3": { "nome_esercizio": "Curl manubri seduto", "ripetizioni": "12-15", "target": "Bicipiti" } } }, { "circuito2": { "nome_circuito": "Circuito 2 — Romanian deadlift + manubri", "tipo": "circuito_forza_metabolico", "recupero": "0 sec tra esercizi, 60-75 sec tra giri", "esercizio1": { "nome_esercizio": "Romanian deadlift con manubri", "ripetizioni": "12-15", "target": "Bicipiti femorali / glutei" }, "esercizio2": { "nome_esercizio": "Hip thrust con manubrio su panca", "ripetizioni": "12-15", "target": "Glutei" }, "esercizio3": { "nome_esercizio": "Shoulder press manubri seduto", "ripetizioni": "12-15", "target": "Spalle anteriori / spalle medie" } } }, { "circuito3": { "nome_circuito": "Circuito 3 — Cavi", "tipo": "circuito_forza_metabolico", "recupero": "0 sec tra esercizi, 60-75 se             s.durationSec = Math.round((Date.now() - Date.parse(s.startedAt)) / 1000);
            s.completedSets = (s.exerciseLogs || []).filter(x => x.done).length;
            s.totalVolume = (s.exerciseLogs || []).reduce((n, x) => n + (Number(x.kg) || 0) * repsNumber(x.reps), 0);
            s.updatedAt = now();
            s.syncStatus = 'local';
            await Store.put('sessions', s);
            await refresh();
            closeModal();
            var others = incompleteSessions();
            if (others.length) openResumeModal(others);
        }

        // ====== Modal durata manuale per > 4 ore ======
        function openDurationModal(id) {
            closeModal();
            var s = S.sessions.find(function (x) { return x.id === id; });
            if (!s) return;
            var html = `
                <div class="modalBackdrop" onclick="closeModal()"></div>
                <div class="modal">
                    <h2>Quanto e durato l allenamento?</h2>
                    <p class="muted">${esc(sessionLabel(s))}</p>
                    <div class="row">
                        <label>Ore</label>
                        <input id="durH" inputmode="numeric" pattern="[0-9]*" type="number" min="0" max="6" value="1" style="max-width:80px">
                        <label>Minuti</label>
                        <input id="durM" inputmode="numeric" pattern="[0-9]*" type="number" min="0" max="59" value="0" style="max-width:80px">
                    </div>
                    <p class="muted">Formato HH:MM. La sessione verra chiusa con questa durata.</p>
                    <div class="row" style="justify-content:flex-end">
                        <button onclick="closeModal()">Annulla</button>
                        <button class="primary" onclick="saveManualDuration('${s.id}')">Salva e chiudi</button>
                    </div>
                </div>`;
            var host = document.createElement('div');
            host.id = 'modalHost';
            host.innerHTML = html;
            document.body.appendChild(host);
        }
        async function saveManualDuration(id) {
            var s = S.sessions.find(x => x.id === id);
            if (!s) return;
            var h = Math.max(0, Number(document.getElementById('durH').value) || 0);
            var m = Math.max(0, Math.min(59, Number(document.getElementById('durM').value) || 0));
            var durationSec = h * 3600 + m * 60;
            await fillMissingFromPrevious(s);
            s.durationSec = durationSec;
            s.endedAt = new Date(Date.parse(s.startedAt) + durationSec * 1000).toISOString();
            s.completedSets = (s.exerciseLogs || []).filter(x => x.done).length;
            s.totalVolume = (s.exerciseLogs || []).reduce((n, x) => n + (Number(x.kg) || 0) * repsNumber(x.reps), 0);
            s.updatedAt = now();
            s.syncStatus = 'local';
            await Store.put('sessions', s);
            await refresh();
            closeModal();
            var others = incompleteSessions();
            if (others.length) openResumeModal(others);
        }

        // ====== Riempimento automatico dati mancanti dalla sessione precedente ======
        function findPreviousCompleted(s) {
            var list = (S.sessions || []).filter(function (x) {
                return x.weekKey === s.weekKey &&
                    x.dayKey === s.dayKey &&
                    x.endedAt &&
                    !x.discarded &&
                    x.id !== s.id;
            }).sort(function (a, b) {
                return String(b.endedAt).localeCompare(String(a.endedAt));
            });

            return list[0] || null;
        }
        function findInLog(logs, blockId, exerciseId, setNo) {
            return (logs || []).find(l => l.blockId === blockId && l.exerciseId === exerciseId && l.setNo === setNo);
        }

        async function fillMissingFromPrevious(s) {
            var c = S.cards.find(function (x) {
                return x.id === s.cardId;
            });

            var w = c && c.weeks.find(function (x) {
                return x.key === s.weekKey;
            });

            var d = w && w.days.find(function (x) {
                return x.key === s.dayKey;
            });

            if (!d) return [];

            var prev = findPreviousCompleted(s);
            s.exerciseLogs = s.exerciseLogs || [];

            var missing = [];

            for (var bi = 0; bi < d.blocks.length; bi++) {
                var b = d.blocks[bi];
                var rounds = +b.rounds || 3;

                for (var ei = 0; ei < b.exerciseIds.length; ei++) {
                    var ex = b.exerciseIds[ei];

                    for (var setNo = 1; setNo <= rounds; setNo++) {
                        var cur = findInLog(s.exerciseLogs, b.id, ex, setNo);

                        if (cur && cur.kg) {
                            continue;
                        }

                        if (prev) {
                            var p = findInLog(prev.exerciseLogs, b.id, ex, setNo);

                            if (p) {
                                if (!cur) {
                                    s.exerciseLogs.push({
                                        blockId: b.id,
                                        exerciseId: ex,
                                        setNo: setNo,
                                        kg: p.kg || 0,
                                        reps: p.reps || '',
                                        done: false,
                                        updatedAt: now()
                                    });
                                } else {
                                    cur.kg = cur.kg || p.kg || 0;
                                    cur.reps = cur.reps || p.reps || '';
                                    cur.updatedAt = now();
                                }

                                continue;
                            }
                        }

                        missing.push({
                            blockId: b.id,
                            exerciseId: ex,
                            setNo: setNo,
                            blockIndex: bi
                        });
                    }
                }
            }

            return missing;
        }

        function exportAll() {
            let a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([
                JSON.stringify({ cards: S.cards, exercises: S.exercises, sessions: S.sessions }, null, 2)
            ], { type: 'application/json' }));
            a.download = 'fit-circuit-backup.json';
            a.click();
        }

        // ====== Sync GitHub ======
        async function loadSyncConfig() {
            var cfg = await Store.get('settings', 'sync-config');
            if (cfg && cfg.value) S.sync.config = cfg.value;
            var meta = await Store.get('settings', 'sync-meta');
            if (meta && meta.value && meta.value.lastSyncAt) S.sync.lastSyncAt = meta.value.lastSyncAt;
        }
        async function saveSyncConfig() {
            var cfg = {
                owner: (document.getElementById('ghOwner').value || '').trim(),
                repo: (document.getElementById('ghRepo').value || '').trim(),
                path: (document.getElementById('ghPath').value || 'backup.json').trim(),
                branch: (document.getElementById('ghBranch').value || 'main').trim(),
                token: (document.getElementById('ghToken').value || '').trim()
            };
            S.sync.config = cfg;
            await Store.put('settings', { id: 'sync-config', value: cfg });
            render();
            syncToRemote({ manual: true });
        }
        async function clearSyncConfig() {
            if (!confirm('Rimuovere le credenziali GitHub salvate?')) return;
            S.sync.config = null;
            S.sync.status = 'idle';
            S.sync.lastError = null;
            await Store.del('settings', 'sync-config');
            render();
        }
        function renderSyncStatus() {
            var el = document.getElementById('syncStatus');
            if (!el) return;
            var st = S.sync.status || 'idle';
            var last = S.sync.lastSyncAt ? new Date(S.sync.lastSyncAt).toLocaleString() : 'mai';
            var on = navigator.onLine ? 'online' : 'offline';
            var err = S.sync.lastError ? ' · Errore: ' + S.sync.lastError : '';
            el.textContent = 'Stato: ' + st + ' · ' + on + ' · Ultimo sync: ' + last + err;
        }
        function scheduleSync() {
            if (!S.sync.config || !S.sync.config.token) return;
            clearTimeout(window.__syncT);
            window.__syncT = setTimeout(function () { syncToRemote(); }, 30000);
        }
        async function syncToRemote(opts) {
            opts = opts || {};
            var cfg = S.sync.config;
            if (!cfg || !cfg.token || !cfg.owner || !cfg.repo) {
                if (opts.manual) alert('Compila owner, repo e token, poi Salva.');
                return;
            }
            if (!navigator.onLine) {
                S.sync.status = 'offline (in attesa di rete)';
                renderSyncStatus();
                return;
            }
            if (S.sync.busy) { S.sync.pending = true; return; }
            S.sync.busy = true;
            S.sync.status = 'sincronizzazione...';
            S.sync.lastError = null;
            renderSyncStatus();
            try {
                var path = cfg.path || 'backup.json';
                var branch = cfg.branch || 'main';
                var base = 'https://api.github.com/repos/' + encodeURIComponent(cfg.owner) + '/' + encodeURIComponent(cfg.repo) + '/contents/' + encodeURI(path);
                var headers = {
                    'Authorization': 'Bearer ' + cfg.token,
                    'Accept': 'application/vnd.github+json',
                    'X-GitHub-Api-Version': '2022-11-28'
                };
                var sha = null;
                var g = await fetch(base + '?ref=' + encodeURIComponent(branch), { headers: headers, cache: 'no-store' });
                if (g.ok) { var gj = await g.json(); sha = gj.sha; }
                else if (g.status !== 404) { throw new Error('GET ' + g.status); }
                var payload = { cards: S.cards, exercises: S.exercises, sessions: S.sessions, exportedAt: now() };
                var content = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
                var body = { message: 'sync ' + now(), content: content, branch: branch };
                if (sha) body.sha = sha;
                var p = await fetch(base, { method: 'PUT', headers: Object.assign({}, headers, { 'Content-Type': 'application/json' }), body: JSON.stringify(body) });
                if (!p.ok) {
                    var t = await p.text().catch(function () { return ''; });
                    throw new Error('PUT ' + p.status + ' ' + t.slice(0, 160));
                }
                S.sync.lastSyncAt = now();
                await Store.put('settings', { id: 'sync-meta', value: { lastSyncAt: S.sync.lastSyncAt } });
                S.sync.status = 'ok';
            } catch (e) {
                S.sync.status = 'errore';
                S.sync.lastError = String(e && e.message || e);
            }
            S.sync.busy = false;
            renderSyncStatus();
            if (S.sync.pending) { S.sync.pending = false; setTimeout(function () { syncToRemote(); }, 500); }
        }
        async function restoreFromRemote() {
            var cfg = S.sync.config;
            if (!cfg || !cfg.token || !cfg.owner || !cfg.repo) return alert('Configura prima le credenziali GitHub.');
            if (!navigator.onLine) return alert('Sei offline: impossibile ripristinare ora.');
            try {
                var path = cfg.path || 'backup.json';
                var branch = cfg.branch || 'main';
                var url = 'https://api.github.com/repos/' + encodeURIComponent(cfg.owner) + '/' + encodeURIComponent(cfg.repo) + '/contents/' + encodeURI(path) + '?ref=' + encodeURIComponent(branch);
                var r = await fetch(url, { headers: { 'Authorization': 'Bearer ' + cfg.token, 'Accept': 'application/vnd.github+json' }, cache: 'no-store' });
                if (r.status === 404) return alert('Nessun backup trovato nel repo.');
                if (!r.ok) return alert('Errore ripristino: HTTP ' + r.status);
                var j = await r.json();
                var raw = atob((j.content || '').replace(/\s/g, ''));
                var text = decodeURIComponent(escape(raw));
                var data = JSON.parse(text);
                if (!confirm('Ripristino sovrascriverà i dati locali (' + S.sessions.length + ' sessioni). Continuare?')) return;
                await Store.clear('cards');
                await Store.clear('exercises');
                await Store.clear('sessions');
                for (var i = 0; i < (data.cards || []).length; i++) await Store.put('cards', data.cards[i]);
                for (var i = 0; i < (data.exercises || []).length; i++) await Store.put('exercises', data.exercises[i]);
                for (var i = 0; i < (data.sessions || []).length; i++) await Store.put('sessions', data.sessions[i]);
                await refresh();
                alert('Ripristino completato: ' + (data.sessions || []).length + ' sessioni caricate.');
            } catch (e) {
                alert('Errore ripristino: ' + (e && e.message || e));
            }
        }

        $('#themeBtn').onclick = () => {
            S.theme = S.theme === 'system' ? 'dark' : S.theme === 'dark' ? 'light' : 'system';
            localStorage.theme = S.theme;
            applyTheme();
        };

        // Autosave globale ad ogni interazione
        ['click', 'change', 'touchend', 'keyup'].forEach(ev => {
            document.addEventListener(ev, () => { if (S.active) persistActive(); }, true);
        });
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden' && S.active) persistActive(true);
            if (document.visibilityState === 'visible') checkIncompleteSessions();
        });
        window.addEventListener('beforeunload', () => { if (S.active) persistActive(true); });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(function () { });
        }
        window.addEventListener('online', function () { renderSyncStatus(); syncToRemote(); });
        window.addEventListener('offline', function () { renderSyncStatus(); });

        (async () => {
            await Store.open();
            await loadSyncConfig();
            await refresh();
            if (!S.cards.length) { await importPlan(EMBEDDED_SCHEDA); }
            await migrateDedupExercises();
            await checkIncompleteSessions();
            if (S.sync.config && S.sync.config.token && S.sessions.length === 0 && navigator.onLine) {
                setTimeout(function () {
                    if (confirm('Nessuna sessione locale ma è configurato il backup GitHub. Ripristinare dal remoto?')) restoreFromRemote();
                }, 300);
            }
        })();
    </script>
</body>
